<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ONE SDP Telecom Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        canvas: '#f8fafc',
                        brandBlue: '#2563eb',
                        brandDark: '#0f172a'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen flex flex-col justify-center items-center px-4 py-8 relative selection:bg-blue-600 selection:text-white">

    <!-- Ambient Background Accent -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full bg-blue-400/10 blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-indigo-400/10 blur-3xl"></div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN LOGIN CARD -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200/80 overflow-hidden relative z-10 animate-in fade-in zoom-in-95 duration-300">
        <!-- Top Accent Gradient Line -->
        <div class="h-2 w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-sky-500"></div>
        
        <div class="p-8 sm:p-10">
            <!-- Brand Logo & Header -->
            <div class="flex flex-col items-center justify-center mb-8">
                <div class="flex items-center gap-2.5 mb-2.5 group">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-blue-500 flex items-center justify-center shadow-md shadow-blue-500/25 group-hover:scale-105 transition-transform">
                        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 3a1 1 0 0 0-1 .26L11.71 7H6a3 3 0 0 0-3 3v2a3 3 0 0 0 3 3h1.22l1.62 4.86A1.5 1.5 0 0 0 10.26 21h1.48a1.5 1.5 0 0 0 1.42-1.97L11.82 15h.11L17 18.74A1 1 0 0 0 18.6 18V4A1 1 0 0 0 18 3zm-1 13.06-4.4-3.06H6a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1h6.6L17 5.94v10.12zM20.5 8.5a1 1 0 0 1 1 1v3a1 1 0 1 1-2 0v-3a1 1 0 0 1 1-1z"/>
                        </svg>
                    </div>
                    <span class="text-2xl font-extrabold tracking-tight text-slate-900">ONE<span class="text-blue-600">SDP</span></span>
                </div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200/80 mb-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-600 animate-pulse"></span>
                    Telecom Gateway Admin
                </div>
                <p class="text-xs text-slate-500 font-medium text-center">Carrier Billing & Direct Operator Billing Management</p>
            </div>

            <!-- Error Banner -->
            <div id="login-error" class="hidden mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2.5">
                <svg class="w-4 h-4 shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span id="login-error-text">Please enter your username or email.</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4" novalidate>
                <div>
                    <label for="login-username" class="block text-xs font-bold text-slate-700 mb-1.5">Username or Corporate Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </span>
                        <input type="text" id="login-username" value="rayhan@onesdp.com" placeholder="e.g. rayhan@onesdp.com"
                            class="w-full pl-10 pr-3.5 py-2.5 text-xs bg-slate-50 border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/15 transition font-medium">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="login-password" class="block text-xs font-bold text-slate-700">Security Password</label>
                        <button type="button" id="forgot-pass-btn" class="text-xs text-blue-600 hover:text-blue-700 font-semibold transition">Forgot password?</button>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </span>
                        <input type="password" id="login-password" value="onesdp2026" placeholder="Enter your password"
                            class="w-full pl-10 pr-10 py-2.5 text-xs bg-slate-50 border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/15 transition font-mono">
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition" aria-label="Toggle password visibility">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="inline-flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="remember-me" checked class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300">
                        <span class="text-xs text-slate-600 font-medium">Keep session authenticated</span>
                    </label>
                </div>

                <button type="submit" id="login-submit-btn" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xs font-bold rounded-xl shadow-md shadow-blue-500/25 transition-all flex items-center justify-center gap-2">
                    <span>Sign In to ONE SDP</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="mt-6 pt-5 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500 bg-slate-50/70 p-3.5 rounded-2xl border border-slate-200/60">
                <div>
                    <span class="text-[11px] text-slate-400 block font-medium">Demo Operator</span>
                    <strong class="text-slate-800 text-xs">Rayhan (Telecom Admin)</strong>
                </div>
                <button type="button" id="quick-demo-login" class="px-3 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-bold transition border border-blue-200/60 shrink-0">
                    Quick Demo Login
                </button>
            </div>
        </div>
    </div>

    <!-- Security & Compliance Footnotes -->
    <div class="mt-6 text-center space-y-2 relative z-10">
        <div class="flex items-center justify-center gap-4 text-[11px] font-semibold text-slate-400">
            <span class="inline-flex items-center gap-1">🔒 TLS 1.3 Strict</span>
            <span>•</span>
            <span class="inline-flex items-center gap-1">🛡 Carrier-Grade DOB</span>
            <span>•</span>
            <span class="inline-flex items-center gap-1">⚡ ISO 27001</span>
        </div>
        <p class="text-xs text-slate-400">&copy; 2026 ONE SDP Telecom Gateway. All rights reserved.</p>
    </div>

    <script>
        $(document).ready(function() {
            function showToast(msg, type = 'info') {
                const toast = $(`<div class="pointer-events-auto px-4 py-2.5 rounded-xl shadow-xl bg-slate-900 text-white text-xs font-semibold flex items-center gap-2 animate-in fade-in slide-in-from-bottom-2 duration-200"><span>${msg}</span></div>`);
                $('#toast-container').append(toast);
                setTimeout(() => toast.remove(), 2500);
            }

            $('#toggle-password').on('click', function() {
                const $pwd = $('#login-password');
                const isPassword = $pwd.attr('type') === 'password';
                $pwd.attr('type', isPassword ? 'text' : 'password');
            });

            $('#login-form').on('submit', function(e) {
                e.preventDefault();
                const u = $.trim($('#login-username').val());
                if(!u) {
                    $('#login-error').removeClass('hidden');
                    return;
                }
                sessionStorage.setItem('onesdp_logged_in', 'true');
                sessionStorage.setItem('onesdp_user_email', u.includes('@') ? u : u + '@onesdp.com');
                showToast('Authentication successful. Redirecting...', 'info');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 500);
            });

            $('#quick-demo-login').on('click', function() {
                sessionStorage.setItem('onesdp_logged_in', 'true');
                sessionStorage.setItem('onesdp_user_email', 'rayhan@onesdp.com');
                showToast('Demo session initialized. Welcome, Rayhan!', 'info');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 400);
            });

            $('#forgot-pass-btn').on('click', function() {
                showToast('Password reset link sent to your registered carrier mailbox.');
            });
        });
    </script>
</body>
</html>
