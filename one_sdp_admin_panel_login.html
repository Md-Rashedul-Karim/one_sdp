                }
            });

            $(document).on('click', '#modal-done-btn', function () {
                $('#app-modal').addClass('hidden');
            });

            $(document).on('submit', '#change-pwd-form', function (e) {
                e.preventDefault();
                $('#app-modal').addClass('hidden');
                showToast('Password updated successfully.', 'success');
            });

            // Live Table Search Filter
            $(document).on('keyup', '#table-search-input', function () {
                const query = $(this).val().toLowerCase();
                $('#txn-table-body tr').each(function () {
                    const rowText = $(this).text().toLowerCase();
                    $(this).toggle(rowText.indexOf(query) > -1);
                });
            });

            // View Transaction Details Modal
            $(document).on('click', '.view-txn-btn', function () {
                const txn = $(this).data('txn');
                openModal(`Transaction Receipt • ${txn.id}`, `
                    <div class="space-y-2.5 text-xs">
                        <div class="flex justify-between py-1.5 border-b border-slate-100"><span class="text-slate-500">Transaction ID</span><span class="font-semibold text-slate-800">${txn.id}</span></div>
                        <div class="flex justify-between py-1.5 border-b border-slate-100"><span class="text-slate-500">Subscriber MSISDN</span><span class="font-mono font-semibold text-slate-800">${txn.msisdn}</span></div>
                        <div class="flex justify-between py-1.5 border-b border-slate-100"><span class="text-slate-500">Operator Gateway</span><span class="font-semibold text-slate-800">${txn.operator}</span></div>
                        <div class="flex justify-between py-1.5 border-b border-slate-100"><span class="text-slate-500">Service Pack</span><span class="font-semibold text-slate-800">${txn.service}</span></div>
                        <div class="flex justify-between py-1.5 border-b border-slate-100"><span class="text-slate-500">Charged Amount</span><span class="font-bold text-blue-600">${txn.amount}</span></div>
                        <div class="flex justify-between py-1.5"><span class="text-slate-500">Gateway Status</span><span>${getStatusBadge(txn.status)}</span></div>
                    </div>
                `);
            });

            // Refresh & New Service Config Buttons
            $(document).on('click', '#refresh-data-btn', function () {
                showToast('Synchronized latest SDP gateway metrics.', 'info');
            });

            $(document).on('click', '#new-service-btn', function () {
                openModal('Create New SDP Service Config', `
                    <form id="create-service-form" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Service Name</label>
                            <input type="text" required placeholder="e.g., Robi Ultra Gaming Daily" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Operator DOB</label>
                                <select class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600">
                                    <option>GSD Robi Dob</option>
                                    <option>Robi Dob</option>
                                    <option>Blink Dob</option>
                                    <option>GP Global</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Tariff (BDT)</label>
                                <input type="text" value="5.00" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-600">
                            </div>
                        </div>
                        <div class="pt-2 flex justify-end gap-2">
                            <button type="button" id="modal-done-btn" class="px-3.5 py-2 border border-slate-200 text-slate-600 font-semibold rounded-lg">Cancel</button>
                            <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg">Save Configuration</button>
                        </div>
                    </form>
                `);
            });

            $(document).on('submit', '#create-service-form', function (e) {
                e.preventDefault();
                $('#app-modal').addClass('hidden');
                showToast('New SDP service configuration saved and deployed.', 'success');
            });

            // CSO TOOl Interactions
            $(document).on('submit', '#cso-search-form', function (e) {
                e.preventDefault();
                const msisdn = $.trim($('#cso-msisdn-input').val()) || '8801819204411';
                $('#cso-res-msisdn').text(msisdn);
                showToast(`Fetched subscription profile for ${msisdn}`, 'info');
            });

            $(document).on('click', '#cso-unsub-btn', function () {
                const msisdn = $('#cso-res-msisdn').text();
                showToast(`Deactivation request queued for ${msisdn}`, 'success');
            });
        });
    </script>
</body>
</html>
